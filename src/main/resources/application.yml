spring:
  application:
    name: be-interview-prep
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  docker:
    compose:
      lifecycle-management: start-only
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

app:
  file-storage:
    base-dir: storage/files
    max-file-size: 5MB

rate-limit:
  limit: 10
  window: 1m
  header: X-API-Key
  paths: /api/quotes/**

booking:
  hold-duration: 5m
  slot-length: 30m
  expiry-sweep-interval: 1m
  clinic-zone: Asia/Kolkata
